<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky background -->
  <rect width="400" height="300" fill="#87CEEB"/>

  <!-- Clouds -->
  <ellipse cx="80" cy="40" rx="25" ry="15" fill="white" opacity="0.8"/>
  <ellipse cx="100" cy="35" rx="20" ry="12" fill="white" opacity="0.8"/>
  <ellipse cx="320" cy="50" rx="30" ry="18" fill="white" opacity="0.8"/>
  <ellipse cx="340" cy="45" rx="25" ry="15" fill="white" opacity="0.8"/>

  <!-- Ground -->
  <rect x="0" y="250" width="400" height="50" fill="#90EE90"/>

  <!-- Bicycle wheels -->
  <circle cx="100" cy="220" r="30" fill="none" stroke="#333" stroke-width="3"/>
  <circle cx="250" cy="220" r="30" fill="none" stroke="#333" stroke-width="3"/>

  <!-- Wheel spokes -->
  <g stroke="#333" stroke-width="1">
    <!-- Front wheel spokes -->
    <line x1="100" y1="190" x2="100" y2="250"/>
    <line x1="70" y1="220" x2="130" y2="220"/>
    <line x1="79" y1="199" x2="121" y2="241"/>
    <line x1="121" y1="199" x2="79" y2="241"/>

    <!-- Back wheel spokes -->
    <line x1="250" y1="190" x2="250" y2="250"/>
    <line x1="220" y1="220" x2="280" y2="220"/>
    <line x1="229" y1="199" x2="271" y2="241"/>
    <line x1="271" y1="199" x2="229" y2="241"/>
  </g>

  <!-- Bicycle frame -->
  <g stroke="#333" stroke-width="3" fill="none">
    <!-- Main triangle -->
    <line x1="100" y1="220" x2="175" y2="160"/>
    <line x1="175" y1="160" x2="220" y2="200"/>
    <line x1="220" y1="200" x2="250" y2="220"/>
    <line x1="175" y1="160" x2="175" y2="200"/>
    <line x1="175" y1="200" x2="100" y2="220"/>
    <line x1="175" y1="200" x2="250" y2="220"/>
  </g>

  <!-- Bicycle seat -->
  <ellipse cx="220" cy="195" rx="15" ry="5" fill="#8B4513"/>

  <!-- Handlebars -->
  <line x1="175" y1="160" x2="175" y2="140" stroke="#333" stroke-width="3"/>
  <line x1="165" y1="140" x2="185" y2="140" stroke="#333" stroke-width="3"/>

  <!-- Pedals -->
  <circle cx="175" cy="200" r="3" fill="#333"/>
  <line x1="170" y1="205" x2="180" y2="195" stroke="#333" stroke-width="2"/>

  <!-- Pelican body -->
  <ellipse cx="200" cy="120" rx="35" ry="25" fill="#F5F5DC" stroke="#333" stroke-width="2"/>

  <!-- Pelican head -->
  <ellipse cx="170" cy="90" rx="20" ry="18" fill="#F5F5DC" stroke="#333" stroke-width="2"/>

  <!-- Pelican beak -->
  <polygon points="145,95 120,100 125,105 150,102" fill="#FFA500" stroke="#333" stroke-width="1"/>

  <!-- Pelican pouch -->
  <path d="M 145,95 Q 135,110 150,115 Q 155,110 145,95" fill="#FFB347" stroke="#333" stroke-width="1"/>

  <!-- Pelican eye -->
  <circle cx="160" cy="85" r="4" fill="white"/>
  <circle cx="162" cy="83" r="2" fill="black"/>

  <!-- Pelican wings -->
  <ellipse cx="220" cy="115" rx="25" ry="15" fill="#E6E6FA" stroke="#333" stroke-width="2" transform="rotate(20 220 115)"/>
  <ellipse cx="215" cy="125" rx="20" ry="10" fill="#D8BFD8" stroke="#333" stroke-width="1" transform="rotate(15 215 125)"/>

  <!-- Pelican legs holding handlebars -->
  <g stroke="#FFA500" stroke-width="3" fill="none">
    <line x1="180" y1="135" x2="170" y2="145"/>
    <line x1="170" y1="145" x2="175" y2="140"/>
  </g>

  <!-- Pelican feet on pedals -->
  <g stroke="#FFA500" stroke-width="3" fill="none">
    <line x1="190" y1="140" x2="175" y2="195"/>
    <line x1="210" y1="140" x2="180" y2="200"/>
  </g>

  <!-- Pelican webbed feet -->
  <g fill="#FFA500" stroke="#333" stroke-width="1">
    <polygon points="172,195 178,195 175,200 170,200"/>
    <polygon points="177,200 183,200 180,205 175,205"/>
  </g>

  <!-- Motion lines for speed effect -->
  <g stroke="#666" stroke-width="2" opacity="0.6">
    <line x1="50" y1="180" x2="80" y2="180"/>
    <line x1="45" y1="190" x2="75" y2="190"/>
    <line x1="40" y1="200" x2="70" y2="200"/>
    <line x1="35" y1="210" x2="65" y2="210"/>
  </g>

  <!-- Sun -->
  <circle cx="350" cy="60" r="20" fill="#FFD700"/>
  <g stroke="#FFD700" stroke-width="2">
    <line x1="350" y1="25" x2="350" y2="35"/>
    <line x1="350" y1="85" x2="350" y2="95"/>
    <line x1="315" y1="60" x2="325" y2="60"/>
    <line x1="375" y1="60" x2="385" y2="60"/>
    <line x1="328" y1="38" x2="335" y2="45"/>
    <line x1="365" y1="75" x2="372" y2="82"/>
    <line x1="372" y1="38" x2="365" y2="45"/>
    <line x1="335" y1="75" x2="328" y2="82"/>
  </g>
</svg>